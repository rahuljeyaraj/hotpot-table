<text x="520.0" y="147.5" font-family="Helvetica,Arial,sans-serif" font-size="25" fill="#1a1a1a" text-anchor="middle" font-weight="bold">table</text>
<text x="520.0" y="177.5" font-family="Helvetica,Arial,sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="normal">1524 x 914.4 mm</text>
<line x1="520.0" y1="196" x2="520.0" y2="272" stroke="#1a1a1a" stroke-width="2.6" stroke-linecap="round" marker-end="url(#a)"/>
<text x="544.0" y="226" font-family="Helvetica,Arial,sans-serif" font-size="19.2" fill="#1a1a1a" text-anchor="start" font-weight="bold">one scale per axis</text>
<text x="544.0" y="250" font-family="Helvetica,Arial,sans-serif" font-size="16.8" fill="#6b6b6b" text-anchor="start" font-weight="normal">table and projector are different shapes</text>
<rect x="360" y="274" width="320" height="112" rx="8" fill="#ffe6c7" stroke="#cc5500" stroke-width="2.2"/>
<text x="520.0" y="315.64" font-family="Helvetica,Arial,sans-serif" font-size="27" fill="#cc5500" text-anchor="middle" font-weight="bold">stage</text>
<text x="520.0" y="344.03999999999996" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="normal">1920 x 1080 projector pixels</text>
<text x="520.0" y="367.03999999999996" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="normal">the only format on the wire</text>
<line x1="520.0" y1="474" x2="520.0" y2="388" stroke="#1a1a1a" stroke-width="2.6" stroke-linecap="round" marker-end="url(#a)"/>
