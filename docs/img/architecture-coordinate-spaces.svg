<text x="520.0" y="516.5" font-family="Helvetica,Arial,sans-serif" font-size="25" fill="#1a1a1a" text-anchor="middle" font-weight="bold">camera</text>
<text x="520.0" y="544.5" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="normal">1920 x 1080 px, mounted inverted</text>
