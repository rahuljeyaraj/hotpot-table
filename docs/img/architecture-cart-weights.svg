<line x1="150" y1="212.8571428571429" x2="1090" y2="212.8571428571429" stroke="#2f7d43" stroke-width="3.0" stroke-linecap="round" stroke-dasharray="10 6"/>
<line x1="187.6" y1="470.8571428571429" x2="233.6" y2="470.8571428571429" stroke="#2f7d43" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="10 6"/>
<text x="247.6" y="476.8571428571429" font-family="Consolas,Menlo,monospace" font-size="18" fill="#2f7d43" text-anchor="start" font-weight="bold">start_g</text>
<text x="359.6" y="476.8571428571429" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#6b6b6b" text-anchor="start" font-weight="normal">the weight when this session began</text>
<line x1="187.6" y1="504.8571428571429" x2="233.6" y2="504.8571428571429" stroke="#1f6f8b" stroke-width="3.2" stroke-linecap="round"/>
<text x="247.6" y="510.8571428571429" font-family="Consolas,Menlo,monospace" font-size="18" fill="#1f6f8b" text-anchor="start" font-weight="bold">live_g</text>
<text x="359.6" y="510.8571428571429" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#6b6b6b" text-anchor="start" font-weight="normal">what the cell reads right now</text>
<line x1="187.6" y1="538.8571428571429" x2="233.6" y2="538.8571428571429" stroke="#cc5500" stroke-width="3.2" stroke-linecap="round"/>
<text x="247.6" y="544.8571428571429" font-family="Consolas,Menlo,monospace" font-size="18" fill="#cc5500" text-anchor="start" font-weight="bold">shown_g</text>
<text x="359.6" y="544.8571428571429" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#6b6b6b" text-anchor="start" font-weight="normal">the number drawn on the table</text>
<line x1="582.4" y1="212.8571428571429" x2="582.4" y2="401.42857142857144" stroke="#1a1a1a" stroke-width="2.0" stroke-linecap="round"/>
<line x1="573.0" y1="212.8571428571429" x2="591.8" y2="212.8571428571429" stroke="#1a1a1a" stroke-width="2.0" stroke-linecap="round"/>
<line x1="573.0" y1="401.42857142857144" x2="591.8" y2="401.42857142857144" stroke="#1a1a1a" stroke-width="2.0" stroke-linecap="round"/>
<rect x="605.76" y="298.52285714285716" width="145.28" height="22.950000000000003" fill="#ffffff" rx="3"/>
<text x="678.4" y="313.14285714285717" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="bold">removed = 60 g</text>
<text x="150" y="630" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#6b6b6b" text-anchor="start" font-weight="normal">time</text>
<text x="413.2" y="630" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#6b6b6b" text-anchor="middle" font-weight="normal">a scoop taken out</text>
<text x="761.0" y="630" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#6b6b6b" text-anchor="middle" font-weight="normal">some of it tipped back</text>
<line x1="60" y1="660" x2="1180" y2="660" stroke="#b8b8b8" stroke-width="1.6" stroke-linecap="round"/>
<text x="60" y="702" font-family="Consolas,Menlo,monospace" font-size="21" fill="#1a1a1a" text-anchor="start" font-weight="bold">removed_g = start_g - live_g</text>
<text x="500" y="702" font-family="Consolas,Menlo,monospace" font-size="21" fill="#1a1a1a" text-anchor="start" font-weight="bold">price = removed_g / 100 x the rate per 100 g</text>
<text x="60" y="752" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="normal">Recomputed from scratch on every tick, from two absolute weights. Nothing anywhere adds up individual pick</text>
<text x="60" y="782" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="normal">events, which is what makes tipping food back work at all: it is the same subtraction with a smaller answer.</text>
<text x="60" y="812" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="normal">shown_g snaps to live_g only once they differ by more than the 10 g deadband, so a bin's price holds still while</text>
<text x="60" y="842" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="normal">the cell wobbles. The floor is real: four of the eight channels sit at 750 to 1500 counts of noise.</text>
<text x="60" y="900" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#cc5500" text-anchor="start" font-weight="bold">A bin the scale cannot weigh reports None, never 0.0. A frozen 0.0 would read as a bin somebody just emptied.</text>
</svg>