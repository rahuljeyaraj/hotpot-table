<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1300" width="1180" height="1300">
<rect width="1180" height="1300" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#cc5500"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f6f8b"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b03030"/></marker></defs>
<text x="40" y="52" font-family="Helvetica,Arial,sans-serif" font-size="27" fill="#1a1a1a" text-anchor="start" font-weight="bold">The light pass is drawn last, and that is the whole trick</text>
<text x="40" y="82" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#6b6b6b" text-anchor="start" font-weight="normal">Five layers into one framebuffer, then one warp onto the projector.</text>
<rect x="90" y="150" width="700" height="84" rx="8" fill="#fbf7f0" stroke="#1a1a1a" stroke-width="2.6"/>
<circle cx="136" cy="192.0" r="24" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="136" y="201.0" font-family="Helvetica,Arial,sans-serif" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
<text x="180" y="186" font-family="Helvetica,Arial,sans-serif" font-size="23" fill="#1a1a1a" text-anchor="start" font-weight="bold">table background</text>
<text x="180" y="214" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#6b6b6b" text-anchor="start" font-weight="normal">#E8E6E1, a warm near-white, cleared first</text>
<rect x="90" y="250" width="700" height="84" rx="8" fill="#f6e6dd" stroke="#cc5500" stroke-width="2.6"/>
<circle cx="136" cy="292.0" r="24" fill="#cc5500" stroke="#cc5500" stroke-width="2.0"/>
<text x="136" y="301.0" font-family="Helvetica,Arial,sans-serif" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
<text x="180" y="286" font-family="Helvetica,Arial,sans-serif" font-size="23" fill="#cc5500" text-anchor="start" font-weight="bold">the fluid</text>
<text x="180" y="314" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#6b6b6b" text-anchor="start" font-weight="normal">the fire, drawn under MULTIPLY so it DARKENS the table</text>
<rect x="90" y="350" width="700" height="84" rx="8" fill="#fdf6dd" stroke="#a5761b" stroke-width="2.6"/>
<circle cx="136" cy="392.0" r="24" fill="#a5761b" stroke="#a5761b" stroke-width="2.0"/>
<text x="136" y="401.0" font-family="Helvetica,Arial,sans-serif" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
<text x="180" y="386" font-family="Helvetica,Arial,sans-serif" font-size="23" fill="#a5761b" text-anchor="start" font-weight="bold">the halo</text>
<text x="180" y="414" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#6b6b6b" text-anchor="start" font-weight="normal">a golden ring wrapped around each bin</text>
<rect x="90" y="450" width="700" height="84" rx="8" fill="#fbf7f0" stroke="#1a1a1a" stroke-width="2.6"/>
<circle cx="136" cy="492.0" r="24" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="136" y="501.0" font-family="Helvetica,Arial,sans-serif" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text>
<text x="180" y="486" font-family="Helvetica,Arial,sans-serif" font-size="23" fill="#1a1a1a" text-anchor="start" font-weight="bold">the UI</text>
<text x="180" y="514" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#6b6b6b" text-anchor="start" font-weight="normal">plate names, prices, the info box, the cart, the buttons</text>
<rect x="90" y="570" width="700" height="84" rx="8" fill="#ffffff" stroke="#1f6f8b" stroke-width="2.6"/>
<circle cx="136" cy="612.0" r="24" fill="#1f6f8b" stroke="#1f6f8b" stroke-width="2.0"/>
<text x="136" y="621.0" font-family="Helvetica,Arial,sans-serif" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
<text x="180" y="606" font-family="Helvetica,Arial,sans-serif" font-size="23" fill="#1f6f8b" text-anchor="start" font-weight="bold">THE LIGHT PASS</text>
<text x="180" y="634" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#6b6b6b" text-anchor="start" font-weight="normal">flat 255,255,255 over every tray cutout, opaque, corners rounded</text>
<text x="820" y="194" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#6b6b6b" text-anchor="start" font-weight="normal">numbered bottom to top,</text>
<text x="820" y="218" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#6b6b6b" text-anchor="start" font-weight="normal">the way the eye reads them</text>
<path d="M 806 492 C 910 492, 910 600, 806 606" fill="none" stroke="#1f6f8b" stroke-width="2.6" stroke-linecap="round" marker-end="url(#ac)"/>
<text x="824" y="530" font-family="Helvetica,Arial,sans-serif" font-size="19" fill="#1f6f8b" text-anchor="start" font-weight="normal">layer 3 is drawn</text>
<text x="824" y="556" font-family="Helvetica,Arial,sans-serif" font-size="19" fill="#1f6f8b" text-anchor="start" font-weight="normal">structurally LAST</text>
<line x1="440.0" y1="654" x2="440.0" y2="700" stroke="#1a1a1a" stroke-width="2.6" stroke-linecap="round" marker-end="url(#a)"/>
<rect x="90" y="702" width="700" height="78" rx="8" fill="#dceef4" stroke="#1f6f8b" stroke-width="2.2"/>
<text x="440.0" y="748.04" font-family="Helvetica,Arial,sans-serif" font-size="22" fill="#1f6f8b" text-anchor="middle" font-weight="bold">keystone warp, then the window</text>
<line x1="60" y1="850" x2="1120" y2="850" stroke="#b8b8b8" stroke-width="1.6" stroke-linecap="round"/>
<text x="60" y="894" font-family="Helvetica,Arial,sans-serif" font-size="22" fill="#1a1a1a" text-anchor="start" font-weight="bold">Why the order matters more than the numbering</text>
<text x="60" y="936" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="normal">The projected field is the room's only light AND the entire interface. A bin's interior has to stay flat pure white,</text>
<text x="60" y="966" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="normal">in every mode, always: that white is what lights the food, and it is also the background of the training photographs</text>
<text x="60" y="996" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="normal">the classifier takes of its own trays. Anything patterned in a cutout would be lighting the food with the UI.</text>
<text x="60" y="1026" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="normal"></text>
<text x="60" y="1056" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="normal">Drawing the light pass third would rely on every future halo and every future UI change happening to keep out of a</text>
<text x="60" y="1086" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="normal">cutout. Drawing it as the final write of the frame makes it true by construction. In practice nothing sees a</text>
<text x="60" y="1116" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="normal">difference: the halo wraps the bin and the plate text sits outside it, so nothing paints into a cutout anyway.</text>
<text x="60" y="1146" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="normal">Only one of the two orders survives someone editing this file next year.</text>
<text x="60" y="1210" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#6b6b6b" text-anchor="start" font-weight="normal">The one thing the light pass has ever been allowed to skip is the black field for dot calibration, and that</text>
<text x="60" y="1238" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#6b6b6b" text-anchor="start" font-weight="normal">calibration was deleted. The exception in the code outlived the feature it was carved out for.</text>
</svg>