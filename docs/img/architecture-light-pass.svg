<text x="136" y="451.0" font-family="Helvetica,Arial,sans-serif" font-size="28.8" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
<text x="180" y="436" font-family="Helvetica,Arial,sans-serif" font-size="27.6" fill="#cc5500" text-anchor="start" font-weight="bold">the fluid</text>
<text x="180" y="464" font-family="Helvetica,Arial,sans-serif" font-size="20.4" fill="#6b6b6b" text-anchor="start" font-weight="normal">the fire, drawn under MULTIPLY so it DARKENS the table</text>
