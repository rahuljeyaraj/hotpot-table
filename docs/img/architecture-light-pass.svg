<text x="180" y="336" font-family="Helvetica,Arial,sans-serif" font-size="27.6" fill="#1f6f8b" text-anchor="start" font-weight="bold">THE LIGHT PASS</text>
<text x="180" y="364" font-family="Helvetica,Arial,sans-serif" font-size="20.4" fill="#6b6b6b" text-anchor="start" font-weight="normal">flat 255,255,255 over every tray cutout, opaque, corners rounded</text>
