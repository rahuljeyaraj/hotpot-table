<text x="136" y="151.0" font-family="Helvetica,Arial,sans-serif" font-size="28.8" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text>
<text x="180" y="136" font-family="Helvetica,Arial,sans-serif" font-size="27.6" fill="#1a1a1a" text-anchor="start" font-weight="bold">the UI</text>
<text x="180" y="164" font-family="Helvetica,Arial,sans-serif" font-size="20.4" fill="#6b6b6b" text-anchor="start" font-weight="normal">plate names, prices, the info box, the cart, the buttons</text>
