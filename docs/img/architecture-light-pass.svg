<text x="180" y="236" font-family="Helvetica,Arial,sans-serif" font-size="27.6" fill="#a5761b" text-anchor="start" font-weight="bold">the halo</text>
<text x="180" y="264" font-family="Helvetica,Arial,sans-serif" font-size="20.4" fill="#6b6b6b" text-anchor="start" font-weight="normal">a golden ring wrapped around each bin</text>
