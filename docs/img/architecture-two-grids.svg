<text x="580.0" y="516" font-family="Helvetica,Arial,sans-serif" font-size="20.4" fill="#6b6b6b" text-anchor="middle" font-weight="normal">Drag one line and the whole row or column it belongs to moves with it, so two bins in a row always share an edge.</text>
