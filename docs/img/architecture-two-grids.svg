<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 1380" width="1160" height="1380">
<rect width="1160" height="1380" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#cc5500"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f6f8b"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b03030"/></marker></defs>
<text x="40" y="52" font-family="Helvetica,Arial,sans-serif" font-size="27" fill="#1a1a1a" text-anchor="start" font-weight="bold">Two bin grids, never derived from each other</text>
<text x="40" y="82" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#6b6b6b" text-anchor="start" font-weight="normal">Four horizontal lines and eight vertical ones. A line belongs to a whole row or a whole column.</text>
<rect x="120" y="130" width="920" height="300" rx="4" fill="#fbf7f0" stroke="#b8b8b8" stroke-width="1.8"/>
<rect x="180" y="170" width="160" height="90" rx="4" fill="#ffe6c7" stroke="#cc5500" stroke-width="1.8"/>
<text x="260.0" y="224.0" font-family="Helvetica,Arial,sans-serif" font-size="24" fill="#cc5500" text-anchor="middle" font-weight="bold">0</text>
<rect x="370" y="170" width="160" height="90" rx="4" fill="#ffe6c7" stroke="#cc5500" stroke-width="1.8"/>
<text x="450.0" y="224.0" font-family="Helvetica,Arial,sans-serif" font-size="24" fill="#cc5500" text-anchor="middle" font-weight="bold">1</text>
