<text x="630" y="692.0" font-family="Helvetica,Arial,sans-serif" font-size="21.6" fill="#1a1a1a" text-anchor="start" font-weight="normal">Nudged with the arrow keys while</text>
<text x="630" y="722.0" font-family="Helvetica,Arial,sans-serif" font-size="21.6" fill="#1a1a1a" text-anchor="start" font-weight="normal">watching the actual light land on the</text>
<text x="630" y="752.0" font-family="Helvetica,Arial,sans-serif" font-size="21.6" fill="#1a1a1a" text-anchor="start" font-weight="normal">actual trays. One pixel a press, ten</text>
<text x="630" y="782.0" font-family="Helvetica,Arial,sans-serif" font-size="21.6" fill="#1a1a1a" text-anchor="start" font-weight="normal">with Shift, and every press ships.</text>
<text x="630" y="812.0" font-family="Helvetica,Arial,sans-serif" font-size="21.6" fill="#1a1a1a" text-anchor="start" font-weight="normal"></text>
<text x="630" y="842.0" font-family="Helvetica,Arial,sans-serif" font-size="21.6" fill="#1a1a1a" text-anchor="start" font-weight="normal">Read by openFrameworks for the halo,</text>
<text x="630" y="872.0" font-family="Helvetica,Arial,sans-serif" font-size="21.6" fill="#1a1a1a" text-anchor="start" font-weight="normal">the white cutout and the fire ring.</text>
<text x="630" y="902.0" font-family="Helvetica,Arial,sans-serif" font-size="21.6" fill="#1a1a1a" text-anchor="start" font-weight="normal"></text>
<text x="630" y="932.0" font-family="Helvetica,Arial,sans-serif" font-size="21.6" fill="#1a1a1a" text-anchor="start" font-weight="normal">Needs no camera at all.</text>
