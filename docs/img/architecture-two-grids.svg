<text x="110" y="692.0" font-family="Helvetica,Arial,sans-serif" font-size="21.6" fill="#1a1a1a" text-anchor="start" font-weight="normal">Dragged onto the rectified preview:</text>
<text x="110" y="722.0" font-family="Helvetica,Arial,sans-serif" font-size="21.6" fill="#1a1a1a" text-anchor="start" font-weight="normal">the camera frame warped through H,</text>
<text x="110" y="752.0" font-family="Helvetica,Arial,sans-serif" font-size="21.6" fill="#1a1a1a" text-anchor="start" font-weight="normal">which is the same picture the</text>
<text x="110" y="782.0" font-family="Helvetica,Arial,sans-serif" font-size="21.6" fill="#1a1a1a" text-anchor="start" font-weight="normal">classifier crops from.</text>
<text x="110" y="812.0" font-family="Helvetica,Arial,sans-serif" font-size="21.6" fill="#1a1a1a" text-anchor="start" font-weight="normal"></text>
<text x="110" y="842.0" font-family="Helvetica,Arial,sans-serif" font-size="21.6" fill="#1a1a1a" text-anchor="start" font-weight="normal">Read by the classifier's crops and by</text>
<text x="110" y="872.0" font-family="Helvetica,Arial,sans-serif" font-size="21.6" fill="#1a1a1a" text-anchor="start" font-weight="normal">core's hand-inside-a-bin hit test.</text>
<text x="110" y="902.0" font-family="Helvetica,Arial,sans-serif" font-size="21.6" fill="#1a1a1a" text-anchor="start" font-weight="normal"></text>
<text x="110" y="932.0" font-family="Helvetica,Arial,sans-serif" font-size="21.6" fill="#1a1a1a" text-anchor="start" font-weight="normal">Needs the camera and the four corners.</text>
