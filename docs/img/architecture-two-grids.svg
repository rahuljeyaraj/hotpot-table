<text x="710.0" y="224.0" font-family="Helvetica,Arial,sans-serif" font-size="24" fill="#cc5500" text-anchor="middle" font-weight="bold">2</text>
<rect x="820" y="170" width="160" height="90" rx="4" fill="#ffe6c7" stroke="#cc5500" stroke-width="1.8"/>
<text x="900.0" y="224.0" font-family="Helvetica,Arial,sans-serif" font-size="24" fill="#cc5500" text-anchor="middle" font-weight="bold">3</text>
<rect x="180" y="300" width="160" height="90" rx="4" fill="#ffe6c7" stroke="#cc5500" stroke-width="1.8"/>
<text x="260.0" y="354.0" font-family="Helvetica,Arial,sans-serif" font-size="24" fill="#cc5500" text-anchor="middle" font-weight="bold">4</text>
<rect x="370" y="300" width="160" height="90" rx="4" fill="#ffe6c7" stroke="#cc5500" stroke-width="1.8"/>
<text x="450.0" y="354.0" font-family="Helvetica,Arial,sans-serif" font-size="24" fill="#cc5500" text-anchor="middle" font-weight="bold">5</text>
<rect x="630" y="300" width="160" height="90" rx="4" fill="#ffe6c7" stroke="#cc5500" stroke-width="1.8"/>
<text x="710.0" y="354.0" font-family="Helvetica,Arial,sans-serif" font-size="24" fill="#cc5500" text-anchor="middle" font-weight="bold">6</text>
<rect x="820" y="300" width="160" height="90" rx="4" fill="#ffe6c7" stroke="#cc5500" stroke-width="1.8"/>
<text x="900.0" y="354.0" font-family="Helvetica,Arial,sans-serif" font-size="24" fill="#cc5500" text-anchor="middle" font-weight="bold">7</text>
<line x1="74" y1="170" x2="1086" y2="170" stroke="#1a1a1a" stroke-width="2.0" stroke-linecap="round" stroke-dasharray="8 5"/>
<line x1="74" y1="260" x2="1086" y2="260" stroke="#1a1a1a" stroke-width="2.0" stroke-linecap="round" stroke-dasharray="8 5"/>
<line x1="74" y1="300" x2="1086" y2="300" stroke="#1a1a1a" stroke-width="2.0" stroke-linecap="round" stroke-dasharray="8 5"/>
<line x1="74" y1="390" x2="1086" y2="390" stroke="#1a1a1a" stroke-width="2.0" stroke-linecap="round" stroke-dasharray="8 5"/>
<line x1="180" y1="104" x2="180" y2="456" stroke="#1a1a1a" stroke-width="2.0" stroke-linecap="round" stroke-dasharray="8 5"/>
<line x1="340" y1="104" x2="340" y2="456" stroke="#1a1a1a" stroke-width="2.0" stroke-linecap="round" stroke-dasharray="8 5"/>
<line x1="370" y1="104" x2="370" y2="456" stroke="#1a1a1a" stroke-width="2.0" stroke-linecap="round" stroke-dasharray="8 5"/>
<line x1="530" y1="104" x2="530" y2="456" stroke="#1a1a1a" stroke-width="2.0" stroke-linecap="round" stroke-dasharray="8 5"/>
<line x1="630" y1="104" x2="630" y2="456" stroke="#1a1a1a" stroke-width="2.0" stroke-linecap="round" stroke-dasharray="8 5"/>
<line x1="790" y1="104" x2="790" y2="456" stroke="#1a1a1a" stroke-width="2.0" stroke-linecap="round" stroke-dasharray="8 5"/>
<line x1="820" y1="104" x2="820" y2="456" stroke="#1a1a1a" stroke-width="2.0" stroke-linecap="round" stroke-dasharray="8 5"/>
<line x1="980" y1="104" x2="980" y2="456" stroke="#1a1a1a" stroke-width="2.0" stroke-linecap="round" stroke-dasharray="8 5"/>
<text x="64" y="176" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#1a1a1a" text-anchor="end" font-weight="bold">4 lines</text>
<text x="64" y="198" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#1a1a1a" text-anchor="end" font-weight="normal">across</text>
<text x="580.0" y="496" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="bold">8 lines down</text>
<text x="580.0" y="516" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#6b6b6b" text-anchor="middle" font-weight="normal">Drag one line and the whole row or column it belongs to moves with it, so two bins in a row always share an edge.</text>
<rect x="80" y="600" width="480" height="320" rx="8" fill="#dceef4" stroke="#1f6f8b" stroke-width="2.2"/>
<text x="320.0" y="642" font-family="Consolas,Menlo,monospace" font-size="21" fill="#1f6f8b" text-anchor="middle" font-weight="bold">state/bin_grid_camera.json</text>
<text x="320.0" y="668.2" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#6b6b6b" text-anchor="middle" font-weight="normal"></text>
<text x="320.0" y="690.2" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#6b6b6b" text-anchor="middle" font-weight="normal"></text>
<text x="320.0" y="712.2" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#6b6b6b" text-anchor="middle" font-weight="normal"></text>
<text x="320.0" y="734.2" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#6b6b6b" text-anchor="middle" font-weight="normal"></text>
<text x="320.0" y="756.2" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#6b6b6b" text-anchor="middle" font-weight="normal"></text>
<text x="320.0" y="778.2" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#6b6b6b" text-anchor="middle" font-weight="normal"></text>
<text x="320.0" y="800.2" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#6b6b6b" text-anchor="middle" font-weight="normal"></text>
<text x="110" y="692" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="normal">Dragged onto the rectified preview:</text>
<text x="110" y="717" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="normal">the camera frame warped through H,</text>
<text x="110" y="742" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="normal">which is the same picture the</text>
<text x="110" y="767" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="normal">classifier crops from.</text>
<text x="110" y="792" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="normal"></text>
<text x="110" y="817" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="normal">Read by the classifier's crops and by</text>
<text x="110" y="842" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="normal">core's hand-inside-a-bin hit test.</text>
<text x="110" y="867" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="normal"></text>
<text x="110" y="892" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="normal">Needs the camera and the four corners.</text>
<rect x="600" y="600" width="480" height="320" rx="8" fill="#ffe6c7" stroke="#cc5500" stroke-width="2.2"/>
<text x="840.0" y="642" font-family="Consolas,Menlo,monospace" font-size="21" fill="#cc5500" text-anchor="middle" font-weight="bold">state/bin_grid_projector.json</text>
<text x="840.0" y="668.2" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#6b6b6b" text-anchor="middle" font-weight="normal"></text>
<text x="840.0" y="690.2" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#6b6b6b" text-anchor="middle" font-weight="normal"></text>
<text x="840.0" y="712.2" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#6b6b6b" text-anchor="middle" font-weight="normal"></text>
<text x="840.0" y="734.2" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#6b6b6b" text-anchor="middle" font-weight="normal"></text>
<text x="840.0" y="756.2" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#6b6b6b" text-anchor="middle" font-weight="normal"></text>
<text x="840.0" y="778.2" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#6b6b6b" text-anchor="middle" font-weight="normal"></text>
<text x="840.0" y="800.2" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#6b6b6b" text-anchor="middle" font-weight="normal"></text>
<text x="630" y="692" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="normal">Nudged with the arrow keys while</text>
<text x="630" y="717" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="normal">watching the actual light land on the</text>
<text x="630" y="742" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="normal">actual trays. One pixel a press, ten</text>
<text x="630" y="767" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="normal">with Shift, and every press ships.</text>
<text x="630" y="792" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="normal"></text>
<text x="630" y="817" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="normal">Read by openFrameworks for the halo,</text>
<text x="630" y="842" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="normal">the white cutout and the fire ring.</text>
<text x="630" y="867" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="normal"></text>
<text x="630" y="892" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="normal">Needs no camera at all.</text>
<line x1="320" y1="552" x2="320" y2="596" stroke="#1f6f8b" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ac)"/>
<line x1="840" y1="552" x2="840" y2="596" stroke="#cc5500" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ao)"/>
<text x="580" y="562" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#6b6b6b" text-anchor="middle" font-weight="bold">same shape,</text>
<text x="580" y="586" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#6b6b6b" text-anchor="middle" font-weight="bold">two files</text>
<line x1="60" y1="990" x2="1100" y2="990" stroke="#b8b8b8" stroke-width="1.6" stroke-linecap="round"/>
<text x="60" y="1034" font-family="Helvetica,Arial,sans-serif" font-size="22" fill="#1a1a1a" text-anchor="start" font-weight="bold">Why two, and why one is never computed from the other</text>
<text x="60" y="1076" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="normal">A camera and a projector are two devices pointed at one table, related by a single flat homography that cannot</text>
<text x="60" y="1107" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="normal">model either one's lens distortion or its mounting error. A rectangle carried from one space into the other looks</text>
<text x="60" y="1138" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="normal">right and can still be wrong in a way nothing catches. So a grid is only ever set by whoever is looking at the</text>
<text x="60" y="1169" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="normal">space it describes: the camera grid by someone dragging on the camera's own picture, the projector grid by</text>
<text x="60" y="1200" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="normal">someone watching light on plywood. Both start from the same seed off the CAD chain, and neither reads the other again.</text>
<text x="60" y="1290" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#6b6b6b" text-anchor="start" font-weight="normal">The version this replaced was eight rectangles dragged one at a time, which let bin 0's top edge and</text>
<text x="60" y="1318" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#6b6b6b" text-anchor="start" font-weight="normal">bin 1's top edge disagree by a few pixels: invisible in a list of numbers, very visible on the table.</text>
</svg>