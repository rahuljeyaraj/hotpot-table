<line x1="60" y1="970" x2="1120" y2="970" stroke="#b8b8b8" stroke-width="1.6" stroke-linecap="round"/>
<text x="60" y="1010" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="normal">Two rules, and they are different. WITHIN one drain: keep the highest seq. ACROSS drains: refuse any seq at or below</text>
<text x="60" y="1040" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="normal">one already accepted, because UDP reorders and a datagram that lost its race arrives after its own successor.</text>
