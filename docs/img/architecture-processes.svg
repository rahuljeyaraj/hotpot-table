<text x="330.0" y="1189.72" font-family="Helvetica,Arial,sans-serif" font-size="21" fill="#1f6f8b" text-anchor="middle" font-weight="bold">WZATCO projector</text>
<text x="330.0" y="1215.92" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#6b6b6b" text-anchor="middle" font-weight="normal">1920 x 1080, keystoned on the projector itself</text>
