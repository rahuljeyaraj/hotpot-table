<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1280" width="1200" height="1280">
<rect width="1200" height="1280" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#cc5500"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f6f8b"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b03030"/></marker></defs>
<text x="40" y="52" font-family="Helvetica,Arial,sans-serif" font-size="32.4" fill="#1a1a1a" text-anchor="start" font-weight="bold">Five processes and four transports</text>
<text x="40" y="82" font-family="Helvetica,Arial,sans-serif" font-size="20.4" fill="#6b6b6b" text-anchor="start" font-weight="normal">run.py starts every one of them and waits for each to say it is ready before starting the next.</text>
<rect x="100" y="125" width="460" height="88" rx="8" fill="#dceef4" stroke="#1f6f8b" stroke-width="2.2"/>
<text x="330.0" y="164.72" font-family="Helvetica,Arial,sans-serif" font-size="21" fill="#1f6f8b" text-anchor="middle" font-weight="bold">Lenovo 300 FHD webcam</text>
<text x="330.0" y="190.92" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#6b6b6b" text-anchor="middle" font-weight="normal">1080p, 95 degree lens, mounted at 180 degrees</text>
<rect x="600" y="125" width="460" height="88" rx="8" fill="#dceef4" stroke="#1f6f8b" stroke-width="2.2"/>
<text x="830.0" y="164.72" font-family="Helvetica,Arial,sans-serif" font-size="21" fill="#1f6f8b" text-anchor="middle" font-weight="bold">XIAO ESP32S3 and 8 x HX711</text>
<text x="830.0" y="190.92" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#6b6b6b" text-anchor="middle" font-weight="normal">one line of eight counts per conversion cycle</text>
<line x1="330.0" y1="213" x2="330.0" y2="258" stroke="#1f6f8b" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ac)"/>
<rect x="393.12" y="225.488" width="65.76" height="25.92" fill="#ffffff" rx="3"/>
<text x="426.0" y="242" font-family="Helvetica,Arial,sans-serif" font-size="19.2" fill="#1f6f8b" text-anchor="middle" font-weight="bold">USB 3</text>
<rect x="100" y="260" width="460" height="96" rx="8" fill="#fbf7f0" stroke="#1a1a1a" stroke-width="2.2"/>
<text x="330.0" y="292.72" font-family="Helvetica,Arial,sans-serif" font-size="21" fill="#1a1a1a" text-anchor="middle" font-weight="bold">camera</text>
<text x="330.0" y="318.92" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#6b6b6b" text-anchor="middle" font-weight="normal">owns the device and the frame ring</text>
<text x="330.0" y="340.92" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#6b6b6b" text-anchor="middle" font-weight="normal">locked exposure and white balance</text>
<line x1="330.0" y1="356" x2="330.0" y2="400" stroke="#1a1a1a" stroke-width="2.4" stroke-linecap="round" marker-end="url(#a)"/>
<rect x="100" y="402" width="460" height="92" rx="8" fill="#ffe6c7" stroke="#cc5500" stroke-width="2.2"/>
<text x="330.0" y="432.08" font-family="Consolas,Menlo,monospace" font-size="19" fill="#cc5500" text-anchor="middle" font-weight="bold">shared memory:  hotpot_frames</text>
<text x="330.0" y="457.88" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#6b6b6b" text-anchor="middle" font-weight="normal">8 slots, 1920 x 1080 BGR, about 47 MB</text>
<text x="330.0" y="479.88" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#6b6b6b" text-anchor="middle" font-weight="normal">one writer, two readers, no lock</text>
<line x1="215" y1="494" x2="215" y2="556" stroke="#cc5500" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ao)"/>
<line x1="445" y1="494" x2="445" y2="556" stroke="#cc5500" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ao)"/>
<rect x="100" y="558" width="225" height="118" rx="8" fill="#fbf7f0" stroke="#1a1a1a" stroke-width="2.2"/>
<text x="212.5" y="590.4" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="bold">tracker</text>
<text x="212.5" y="616.4" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#6b6b6b" text-anchor="middle" font-weight="normal">MediaPipe Hands</text>
<text x="212.5" y="638.4" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#6b6b6b" text-anchor="middle" font-weight="normal">one hand, smoothed,</text>
<text x="212.5" y="660.4" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#6b6b6b" text-anchor="middle" font-weight="normal">60 datagrams a second</text>
<rect x="335" y="558" width="225" height="118" rx="8" fill="#fbf7f0" stroke="#1a1a1a" stroke-width="2.2"/>
<text x="447.5" y="590.4" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="bold">classifier</text>
<text x="447.5" y="616.4" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#6b6b6b" text-anchor="middle" font-weight="normal">crops each bin and</text>
<text x="447.5" y="638.4" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#6b6b6b" text-anchor="middle" font-weight="normal">labels what is in it</text>
<text x="447.5" y="660.4" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#6b6b6b" text-anchor="middle" font-weight="normal">(see the last section)</text>
<rect x="100" y="740" width="960" height="132" rx="8" fill="#f2ede4" stroke="#1a1a1a" stroke-width="2.2"/>
<text x="580.0" y="791.32" font-family="Helvetica,Arial,sans-serif" font-size="26" fill="#1a1a1a" text-anchor="middle" font-weight="bold">core</text>
<text x="580.0" y="819.5200000000001" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#6b6b6b" text-anchor="middle" font-weight="normal">the TCP server every other process dials into: the state machine, the cart, the prices,</text>
<text x="580.0" y="842.5200000000001" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#6b6b6b" text-anchor="middle" font-weight="normal">the bin map, the geometry, the load cells, the order database and the staff dashboard</text>
<path d="M 830.0 213 L 830.0 690 L 910 690 L 910 738" fill="none" stroke="#1f6f8b" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ac)"/>
<rect x="888.96" y="406.24" width="218.08" height="21.6" fill="#ffffff" rx="3"/>
<text x="998.0" y="420" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#1f6f8b" text-anchor="middle" font-weight="bold">USB serial, 115200 baud</text>
<rect x="880.0" y="430.24" width="236.00000000000003" height="21.6" fill="#ffffff" rx="3"/>
<text x="998.0" y="444" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#1f6f8b" text-anchor="middle" font-weight="bold">about 10.7 lines a second</text>
<line x1="215" y1="676" x2="215" y2="738" stroke="#1a1a1a" stroke-width="2.4" stroke-linecap="round" marker-end="url(#a)"/>
