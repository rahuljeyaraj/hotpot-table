<rect x="155.83999999999997" y="889.488" width="388.32000000000005" height="25.92" fill="#ffffff" rx="3"/>
<text x="350" y="906" font-family="Helvetica,Arial,sans-serif" font-size="19.2" fill="#1a1a1a" text-anchor="middle" font-weight="bold">TCP 8765:  state, 60 times a second</text>
<line x1="850" y1="872" x2="850" y2="946" stroke="#1a1a1a" stroke-width="2.6" stroke-linecap="round" marker-end="url(#a)"/>
<rect x="688.096" y="889.488" width="323.808" height="25.92" fill="#ffffff" rx="3"/>
<text x="850" y="906" font-family="Helvetica,Arial,sans-serif" font-size="19.2" fill="#1a1a1a" text-anchor="middle" font-weight="bold">HTTP and WebSocket, port 8090</text>
