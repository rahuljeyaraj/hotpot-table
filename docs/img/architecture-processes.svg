<text x="215" y="712" font-family="Helvetica,Arial,sans-serif" font-size="19.2" fill="#1a1a1a" text-anchor="middle" font-weight="bold">TCP 8765</text>
<line x1="445" y1="676" x2="445" y2="738" stroke="#1a1a1a" stroke-width="2.4" stroke-linecap="round" marker-end="url(#a)"/>
<rect x="395.992" y="695.488" width="98.016" height="25.92" fill="#ffffff" rx="3"/>
<text x="445" y="712" font-family="Helvetica,Arial,sans-serif" font-size="19.2" fill="#1a1a1a" text-anchor="middle" font-weight="bold">TCP 8765</text>
<rect x="100" y="950" width="460" height="132" rx="8" fill="#fbf7f0" stroke="#1a1a1a" stroke-width="2.2"/>
<text x="330.0" y="990.68" font-family="Helvetica,Arial,sans-serif" font-size="24" fill="#1a1a1a" text-anchor="middle" font-weight="bold">of  (openFrameworks)</text>
<text x="330.0" y="1017.4799999999999" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#6b6b6b" text-anchor="middle" font-weight="normal">draws the table exactly as core</text>
<text x="330.0" y="1039.48" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#6b6b6b" text-anchor="middle" font-weight="normal">describes it, sixty times a second.</text>
<text x="330.0" y="1061.48" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#6b6b6b" text-anchor="middle" font-weight="normal">Every word arrives already translated.</text>
<rect x="600" y="950" width="460" height="132" rx="8" fill="#fbf7f0" stroke="#1a1a1a" stroke-width="2.2"/>
<text x="830.0" y="990.68" font-family="Helvetica,Arial,sans-serif" font-size="24" fill="#1a1a1a" text-anchor="middle" font-weight="bold">staff dashboard</text>
<text x="830.0" y="1017.4799999999999" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#6b6b6b" text-anchor="middle" font-weight="normal">any browser on the network,</text>
<text x="830.0" y="1039.48" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#6b6b6b" text-anchor="middle" font-weight="normal">a phone included.</text>
<text x="830.0" y="1061.48" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#6b6b6b" text-anchor="middle" font-weight="normal">Bins, Setup, Capture, Developer.</text>
