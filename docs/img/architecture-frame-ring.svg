<text x="40" y="52" font-family="Helvetica,Arial,sans-serif" font-size="32.4" fill="#1a1a1a" text-anchor="start" font-weight="bold">The frame ring in shared memory</text>
<text x="40" y="82" font-family="Helvetica,Arial,sans-serif" font-size="20.4" fill="#6b6b6b" text-anchor="start" font-weight="normal">One writer, two readers, no lock. The order of the three writes is the whole mechanism.</text>
<rect x="80" y="120" width="480" height="96" rx="8" fill="#ffe6c7" stroke="#cc5500" stroke-width="2.2"/>
<text x="320.0" y="152.72" font-family="Helvetica,Arial,sans-serif" font-size="21" fill="#cc5500" text-anchor="middle" font-weight="bold">header,  64 bytes</text>
<text x="320.0" y="178.92" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#6b6b6b" text-anchor="middle" font-weight="normal">magic HPTF, version 3, 1920, 1080, 3, 8</text>
<text x="320.0" y="200.92" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#6b6b6b" text-anchor="middle" font-weight="normal">write_counter : u64</text>
<text x="660" y="150" font-family="Helvetica,Arial,sans-serif" font-size="25.2" fill="#1a1a1a" text-anchor="start" font-weight="bold">camera writes, in this order:</text>
<text x="660" y="186.0" font-family="Helvetica,Arial,sans-serif" font-size="22.8" fill="#1a1a1a" text-anchor="start" font-weight="normal">1.  the pixels into the slot</text>
<text x="660" y="224.4" font-family="Helvetica,Arial,sans-serif" font-size="22.8" fill="#1a1a1a" text-anchor="start" font-weight="normal">2.  the slot header (frame_id, ts_ns)</text>
<text x="660" y="262.8" font-family="Helvetica,Arial,sans-serif" font-size="22.8" fill="#1a1a1a" text-anchor="start" font-weight="normal">3.  write_counter, last</text>
<text x="660" y="300" font-family="Helvetica,Arial,sans-serif" font-size="20.4" fill="#6b6b6b" text-anchor="start" font-weight="normal">Step 3 is what publishes the frame, so it</text>
<text x="660" y="324" font-family="Helvetica,Arial,sans-serif" font-size="20.4" fill="#6b6b6b" text-anchor="start" font-weight="normal">happens after everything it publishes.</text>
