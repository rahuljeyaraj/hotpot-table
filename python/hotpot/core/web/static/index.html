<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Hot Pot — Staff View</title>
<style>
  /* Dark UI (doc section 12.1): this is the operator's tablet in a dim
     room, not the projected field — a white page here is a flashlight
     in someone's face. */
  :root {
    color-scheme: dark;
    --bg: #16171a;
    --panel: #1e2024;
    --text: #e8e8ea;
    --muted: #9a9ca3;
    --green: #3ecf6e;
    --amber: #e8b33d;
    --red: #e05d5d;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: Inter, "Noto Sans SC", system-ui, sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 1;
    display: flex; align-items: center; gap: 16px;
    padding: 12px 16px;
    background: var(--panel);
    border-bottom: 1px solid #2a2c31;
  }
  .title { font-size: 20px; font-weight: 500; white-space: nowrap; }
  .mode, .order {
    font-size: 14px; font-weight: 400; color: var(--muted);
    white-space: nowrap;
  }
  .spacer { flex: 1; }
  .pips { display: flex; gap: 10px; }
  .pip {
    display: flex; align-items: center; justify-content: center;
    width: 28px; height: 28px;              /* header chrome, not a tap
                                                target — the tappable
                                                44px version arrives with
                                                the detail view (§12.2) */
    border-radius: 50%;
    font-size: 12px; font-weight: 500;
    color: #10110f;
    background: var(--red);                  /* never-connected = red,
                                                 doc section 12.2 / health.py */
    transition: background-color 200ms ease;
  }
  .pip[data-colour="green"] { background: var(--green); }
  .pip[data-colour="amber"] { background: var(--amber); color: #2a1f00; }
  .pip[data-colour="red"]   { background: var(--red); color: #2a0000; }
  .conn-banner {
    display: none;
    padding: 8px 16px; font-size: 14px;
    background: #402626; color: #ffd7d7;
  }
  .conn-banner.show { display: block; }

  /* --- tab bar (doc section 12.2) ---------------------------------------
     Live (M1) and Bins (M2) have real tab bodies. Orders/Setup/Capture
     are M4/M5/M6 build items — not stubbed here, since a button leading
     to nothing is worse than a button that doesn't exist yet. */
  nav.tabs {
    display: flex; align-items: center; gap: 4px;
    padding: 6px 12px;
    background: var(--panel);
    border-bottom: 1px solid #2a2c31;
  }
  .tab {
    min-height: 44px; padding: 0 18px;         /* doc 12.1: 44x44 min touch target */
    border: none; border-radius: 6px 6px 0 0;
    background: transparent; color: var(--muted);
    font-size: 14px; font-weight: 500;
    cursor: pointer;
  }
  .tab.active { background: var(--bg); color: var(--text); }
  .dev-toggle {
    min-height: 44px; padding: 0 14px;
    border: 1px solid #333640; border-radius: 6px;
    background: transparent; color: var(--muted);
    font-size: 13px; cursor: pointer;
  }
  .dev-toggle.on { color: var(--amber); border-color: var(--amber); }

  main { padding: 24px 16px; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* --- Live tab shell (doc section 12.3) --------------------------------
     No camera (M3), no tracker (M5), no bin rects on the wire yet (core
     doesn't send them until M4's geometry_store) — so this is structure
     only: the slot the MJPEG <img> + overlay <canvas> will occupy, and
     the toggle chips that will gate what the overlay draws. Disabled
     rather than removed, so the shell is visibly the same layout the real
     tab will use. */
  .live-shell {
    max-width: 960px;
  }
  .live-feed-placeholder {
    aspect-ratio: 16 / 9;
    display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 24px;
    background: #0f1012; border: 1px dashed #333640; border-radius: 8px;
    color: var(--muted); font-size: 14px;
  }
  .chips { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .chip {
    min-height: 44px; padding: 0 16px;
    border: 1px solid #333640; border-radius: 20px;
    background: transparent; color: var(--muted);
    font-size: 13px;
  }
  .chip:disabled { opacity: 0.5; cursor: default; }

  /* --- Bins tab (doc section 12.4) --------------------------------------
     8 cards: name, live grams (doc 12.9: 44px tabular-nums for the large
     numeric), price/100g, a noise dot bar, and Tare/Calibrate. */
  .bins-shell { max-width: 1100px; }
  .serial-status {
    margin-bottom: 14px; font-size: 14px; color: var(--muted);
  }
  .serial-status.down { color: var(--red); }
  .bins-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 12px;
  }
  .bin-card {
    background: var(--panel); border: 1px solid #2a2c31; border-radius: 8px;
    padding: 14px;
  }
  .bin-card .bin-head {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 14px; color: var(--muted); gap: 8px;
  }
  .bin-card .bin-name { color: var(--text); font-weight: 500; text-align: right; }
  .bin-card .bin-grams {
    font-size: 44px; font-weight: 500; margin: 6px 0 0;
    font-variant-numeric: tabular-nums;
  }
  .bin-card .bin-grams.unmeasured { color: var(--muted); font-size: 26px; }
  .bin-card .bin-price { font-size: 14px; color: var(--muted); margin-top: 2px; }
  .noise-row { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
  .noise-dots { display: flex; gap: 3px; }
  .noise-dot { width: 8px; height: 8px; border-radius: 50%; background: #333640; }
  .noise-dot.on { background: var(--green); }
  .noise-row.noisy .noise-dot.on { background: var(--amber); }
  .noise-label { font-size: 12px; color: var(--muted); }
  .bin-actions { display: flex; gap: 8px; margin-top: 14px; }
  .bin-btn {
    flex: 1; min-height: 44px;
    border: 1px solid #3a3d47; border-radius: 6px;
    background: #22252b; color: var(--text);
    font-size: 13px; cursor: pointer;
  }
  .bin-btn:active { background: #2c2f37; }
  .bin-hint { font-size: 11px; color: var(--muted); text-align: center; margin-top: 4px; }

  /* --- calibration wizard modal (doc section 12.4: "one screen at a
     time, no branching") -------------------------------------------- */
  .modal-backdrop {
    display: none; position: fixed; inset: 0; z-index: 5;
    align-items: center; justify-content: center;
    background: rgba(0, 0, 0, 0.6); padding: 16px;
  }
  .modal-backdrop.show { display: flex; }
  .modal {
    width: 100%; max-width: 360px;
    background: var(--panel); border: 1px solid #333640; border-radius: 10px;
    padding: 20px;
  }
  .modal-title { font-size: 18px; font-weight: 500; margin-bottom: 10px; }
  .modal-body { font-size: 14px; line-height: 1.5; }
  .modal-body.error { color: var(--red); }
  .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
  .modal-btn {
    flex: 1; min-height: 44px; border-radius: 6px;
    border: 1px solid #3a3d47; background: #22252b; color: var(--text);
    font-size: 14px; cursor: pointer;
  }
  .modal-btn.primary {
    background: var(--green); border-color: var(--green);
    color: #062b12; font-weight: 600;
  }
  .weight-input-row {
    display: flex; align-items: baseline; justify-content: center;
    gap: 8px; margin: 12px 0;
  }
  .weight-input {
    width: 140px; font-size: 32px; font-weight: 500; text-align: center;
    font-variant-numeric: tabular-nums;
    padding: 6px 4px; border-radius: 6px;
    border: 1px solid #3a3d47; background: #22252b; color: var(--text);
  }
  .weight-input:focus { outline: none; border-color: var(--green); }
  .weight-unit { font-size: 16px; color: var(--muted); }

  /* --- developer panel (doc section 12.8) -------------------------------
     Spec home is a toggle inside the Setup tab; Setup doesn't exist until
     M4 (doc section 21). Homed on the tab bar for now so the mock
     controls this milestone needs are reachable at all — move this into
     Setup's toggle when that tab is built, per the doc. */
  .dev-panel {
    display: none;
    position: sticky; bottom: 0;
    max-height: 46vh; overflow-y: auto;
    padding: 12px 16px 20px;
    background: var(--panel);
    border-top: 1px solid #333640;
  }
  .dev-panel.show { display: block; }
  .dev-panel h3 {
    margin: 0 0 4px; font-size: 14px; font-weight: 600;
  }
  .dev-note { color: var(--muted); font-weight: 400; font-size: 12px; }
  .mock-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 8px; margin-top: 10px;
  }
  .mock-row {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 8px;
    background: #16171a; border: 1px solid #2a2c31; border-radius: 6px;
  }
  .mock-row .bin-label { font-size: 13px; width: 46px; flex: none; }
  .mock-btn {
    flex: 1; min-height: 44px;
    border: 1px solid #3a3d47; border-radius: 6px;
    background: #22252b; color: var(--text);
    font-size: 12px; cursor: pointer;
  }
  .mock-btn:active { background: #2c2f37; }
  .mock-btn.putback { color: var(--amber); }
</style>
</head>
<body>
  <div id="connBanner" class="conn-banner">Not connected to core — retrying…</div>
  <header>
    <!-- Doc §12.2's mockup shows 称重火锅 here, but that's under the
         staff view's own EN|中文 toggle (doc line ~1336: "the operator may
         read English while the table shows Chinese") — not built yet, and
         zh locale data doesn't exist yet either (M1 is English-only
         end to end). Staff view isn't customer-facing, so English until
         that toggle exists. -->
    <div class="title">Hot Pot</div>
    <div class="mode" id="mode">—</div>
    <div class="order" id="order">—</div>
    <div class="spacer"></div>
    <div class="pips" id="pips"></div>
  </header>
  <nav class="tabs">
    <button class="tab active" data-tab="live">Live</button>
    <button class="tab" data-tab="bins">Bins</button>
    <div class="spacer"></div>
    <button id="devToggle" class="dev-toggle">Developer</button>
  </nav>
  <main>
    <section class="tab-panel active" data-tab="live">
      <div class="live-shell">
        <div class="live-feed-placeholder">
          Camera feed arrives at M3.<br>
          This slot will hold the MJPEG image and a bin/hand overlay
          canvas (doc §12.3).
        </div>
        <div class="chips">
          <button class="chip" disabled>rects</button>
          <button class="chip" disabled>labels</button>
          <button class="chip" disabled>weights</button>
          <button class="chip" disabled>hands</button>
          <button class="chip" disabled>dots</button>
        </div>
      </div>
    </section>
    <section class="tab-panel" data-tab="bins">
      <!-- Doc §12.4: 8 cards, live grams, a noise indicator, and a
           one-screen-at-a-time Tare/Calibrate wizard (#calBackdrop below).
           Grams here come straight from the load-cell reader, not the
           mock cart — a bin can show "—" here while the Live tab still
           reflects M1's mock pick/put-back cycle. That gap closes at
           M2's build item 5. -->
      <div class="bins-shell">
        <div class="serial-status" id="serialStatus">Load cells: —</div>
        <div class="bins-grid" id="binsGrid"></div>
      </div>
    </section>
  </main>
  <section id="devPanel" class="dev-panel">
    <h3>Mock picks / put-backs
      <span class="dev-note">— doc §12.8's {45,6,120,3,25,80} g cycle, one shared pointer for every button below</span>
    </h3>
    <div class="mock-grid" id="mockGrid"></div>
  </section>

  <!-- Doc §12.4's calibration flow: one screen at a time, no branching.
       A single modal is reused for every bin's Tare and Calibrate flow
       rather than one per card, since only one can run at a time anyway
       (core/calibrator.py's own one-at-a-time lock). -->
  <div id="calBackdrop" class="modal-backdrop">
    <div class="modal">
      <div class="modal-title" id="calTitle">—</div>
      <div class="modal-body" id="calBody"></div>
      <div class="modal-actions" id="calActions"></div>
    </div>
  </div>

<script>
(function () {
  "use strict";

  // Doc section 12.2 draw order and one-letter codes. The order also
  // seeds a red pip for a process this build has never heard from, which
  // is the honest thing to show (doc section 4.2 / common/health.py).
  var PIPS = [
    { who: "camera",     label: "camera",     code: "C" },
    { who: "tracker",    label: "tracker",    code: "T" },
    { who: "classifier", label: "classifier", code: "S" },
    { who: "voice",      label: "voice",      code: "V" },
    { who: "core",       label: "core",       code: "O" },
    { who: "of",         label: "table",      code: "B" },
  ];

  var pipsEl = document.getElementById("pips");
  var banner = document.getElementById("connBanner");
  var elByWho = {};

  PIPS.forEach(function (p) {
    var el = document.createElement("div");
    el.className = "pip";
    el.dataset.colour = "red";
    el.textContent = p.code;
    el.title = p.label + ": down";
    pipsEl.appendChild(el);
    elByWho[p.who] = { el: el, label: p.label };
  });

  function applyPips(pips) {
    pips.forEach(function (p) {
      var entry = elByWho[p.who];
      if (!entry) return;   // an unexpected process name; nowhere to draw it
      entry.el.dataset.colour = p.colour;
      var age = p.age === null ? "never" : p.age.toFixed(1) + "s ago";
      entry.el.title = entry.label + ": " + p.status + " (last beat " + age + ")";
    });
  }

  // --- tab bar (doc section 12.2) ---------------------------------------
  var tabButtons = document.querySelectorAll(".tab");
  var tabPanels = document.querySelectorAll(".tab-panel");
  Array.prototype.forEach.call(tabButtons, function (btn) {
    btn.addEventListener("click", function () {
      var tab = btn.dataset.tab;
      Array.prototype.forEach.call(tabButtons, function (b) {
        b.classList.toggle("active", b === btn);
      });
      Array.prototype.forEach.call(tabPanels, function (p) {
        p.classList.toggle("active", p.dataset.tab === tab);
      });
    });
  });

  // --- developer panel toggle (doc section 12.8: "persisted in
  // localStorage") -----------------------------------------------------
  var DEV_KEY = "hotpot.devPanelOpen";
  var devToggle = document.getElementById("devToggle");
  var devPanel = document.getElementById("devPanel");

  function setDevOpen(open) {
    devPanel.classList.toggle("show", open);
    devToggle.classList.toggle("on", open);
    try { localStorage.setItem(DEV_KEY, open ? "1" : "0"); } catch (e) { /* private mode, etc — not fatal */ }
  }
  devToggle.addEventListener("click", function () {
    setDevOpen(!devPanel.classList.contains("show"));
  });
  var storedOpen = "0";
  try { storedOpen = localStorage.getItem(DEV_KEY) || "0"; } catch (e) { /* ignore */ }
  setDevOpen(storedOpen === "1");

  // --- mock pick/put-back controls (doc section 12.8, build item 5) -----
  // "the keyboard mock from Stage 2, reborn... with the {45,6,120,3,25,80}
  // g size cycle." One shared pointer, not eight independent ones — the
  // doc calls it "the cycle", singular, and the M1 acceptance test's own
  // example ("picking 45g then 6g then 120g from one bin") is exactly
  // this cycle's first three values in order.
  var CYCLE = [45, 6, 120, 3, 25, 80];
  var cycleIndex = 0;
  var hintEls = [];   // every button that shows the upcoming gram value

  function nextGrams() {
    var g = CYCLE[cycleIndex];
    cycleIndex = (cycleIndex + 1) % CYCLE.length;
    return g;
  }
  function refreshHints() {
    var upcoming = CYCLE[cycleIndex];
    hintEls.forEach(function (el) { el.textContent = el.dataset.verb + " " + upcoming + "g"; });
  }

  // Set inside connect() below, on every (re)connect — declared here,
  // ahead of the click handlers that read it, so there is one place that
  // says where the live socket lives instead of leaving it to hoisting.
  var currentWs = null;

  function sendMock(kind, bin, grams) {
    if (!currentWs || currentWs.readyState !== WebSocket.OPEN) return;
    currentWs.send(JSON.stringify({ t: kind, bin: bin, grams: grams }));
  }

  var mockGrid = document.getElementById("mockGrid");
  for (var i = 0; i < 8; i++) {
    (function (bin) {
      var row = document.createElement("div");
      row.className = "mock-row";

      var label = document.createElement("div");
      label.className = "bin-label";
      label.textContent = "Bin " + bin;
      row.appendChild(label);

      var pick = document.createElement("button");
      pick.className = "mock-btn";
      pick.dataset.verb = "Pick";
      pick.addEventListener("click", function () {
        sendMock("mock_pick", bin, nextGrams());
        refreshHints();
      });
      row.appendChild(pick);
      hintEls.push(pick);

      var putback = document.createElement("button");
      putback.className = "mock-btn putback";
      putback.dataset.verb = "Put back";
      putback.addEventListener("click", function () {
        sendMock("mock_putback", bin, nextGrams());
        refreshHints();
      });
      row.appendChild(putback);
      hintEls.push(putback);

      mockGrid.appendChild(row);
    })(i);
  }
  refreshHints();

  // --- Bins tab (doc section 12.4, M2 build item 4) ---------------------

  function sendCal(obj) {
    if (!currentWs || currentWs.readyState !== WebSocket.OPEN) return;
    currentWs.send(JSON.stringify(obj));
  }

  var serialStatusEl = document.getElementById("serialStatus");
  var binsGrid = document.getElementById("binsGrid");
  var binCards = [];

  for (var bi = 0; bi < 8; bi++) {
    (function (bin) {
      var card = document.createElement("div");
      card.className = "bin-card";

      var head = document.createElement("div");
      head.className = "bin-head";
      var idxEl = document.createElement("div");
      idxEl.textContent = "Bin " + bin;
      var nameEl = document.createElement("div");
      nameEl.className = "bin-name";
      nameEl.textContent = "—";
      head.appendChild(idxEl);
      head.appendChild(nameEl);
      card.appendChild(head);

      var gramsEl = document.createElement("div");
      gramsEl.className = "bin-grams unmeasured";
      gramsEl.textContent = "—";
      card.appendChild(gramsEl);

      var priceEl = document.createElement("div");
      priceEl.className = "bin-price";
      card.appendChild(priceEl);

      var noiseRow = document.createElement("div");
      noiseRow.className = "noise-row";
      var dotsWrap = document.createElement("div");
      dotsWrap.className = "noise-dots";
      var dotEls = [];
      for (var d = 0; d < 8; d++) {
        var dot = document.createElement("div");
        dot.className = "noise-dot";
        dotsWrap.appendChild(dot);
        dotEls.push(dot);
      }
      var noiseLabel = document.createElement("div");
      noiseLabel.className = "noise-label";
      noiseLabel.textContent = "unmeasured";
      noiseRow.appendChild(dotsWrap);
      noiseRow.appendChild(noiseLabel);
      card.appendChild(noiseRow);

      var actions = document.createElement("div");
      actions.className = "bin-actions";
      var tareBtn = document.createElement("button");
      tareBtn.className = "bin-btn";
      tareBtn.textContent = "Tare";
      tareBtn.addEventListener("click", function () { openWizard(bin, "tare"); });
      var calBtn = document.createElement("button");
      calBtn.className = "bin-btn";
      calBtn.textContent = "Calibrate";
      calBtn.addEventListener("click", function () { openWizard(bin, "calibrate"); });
      actions.appendChild(tareBtn);
      actions.appendChild(calBtn);
      card.appendChild(actions);

      // Doc section 12.1's plain-language principle, applied to the one
      // thing the operator needs to know before Calibrate makes sense:
      // core/calibrator.py refuses an untared bin server-side already,
      // this just says why up front instead of making them discover it
      // by tapping Calibrate and reading the refusal.
      var hintEl = document.createElement("div");
      hintEl.className = "bin-hint";
      card.appendChild(hintEl);

      binsGrid.appendChild(card);
      binCards[bin] = {
        nameEl: nameEl, gramsEl: gramsEl, priceEl: priceEl,
        dotEls: dotEls, noiseRow: noiseRow, noiseLabel: noiseLabel,
        hintEl: hintEl,
      };
    })(bi);
  }

  function applyBins(msg) {
    var s = msg.serial || {};
    if (s.open && !s.stale) {
      serialStatusEl.textContent = "Load cells: connected, " + (s.hz || 0).toFixed(1) + " Hz";
      serialStatusEl.classList.remove("down");
    } else {
      serialStatusEl.textContent = "Load cells: no connection";
      serialStatusEl.classList.add("down");
    }
    (msg.bins || []).forEach(function (b) {
      var c = binCards[b.i];
      if (!c) return;
      c.nameEl.textContent = b.label || "(unresolved)";
      if (b.grams === null || b.grams === undefined) {
        c.gramsEl.textContent = "—";
        c.gramsEl.classList.add("unmeasured");
      } else {
        c.gramsEl.textContent = b.grams + " g";
        c.gramsEl.classList.remove("unmeasured");
      }
      c.priceEl.textContent = b.sub || "";
      var dots = b.noise_dots;
      var known = dots !== null && dots !== undefined;
      c.noiseRow.classList.toggle("noisy", !!b.noisy);
      for (var di = 0; di < c.dotEls.length; di++) {
        c.dotEls[di].classList.toggle("on", known && di < dots);
      }
      c.noiseLabel.textContent = !known ? "unmeasured" : (b.noisy ? "noisy" : "stable");
      c.hintEl.textContent = b.tared ? "" : "Tare first, then Calibrate";
    });
  }

  // --- the Tare/Calibrate wizard: one screen at a time, no branching
  // (doc section 12.4). A single modal is reused for every bin rather
  // than one per card — only one flow can run at once anyway
  // (core/calibrator.py's own one-at-a-time lock) — driven by `wizard`,
  // the one piece of state every render below reads.
  var calBackdrop = document.getElementById("calBackdrop");
  var calTitle = document.getElementById("calTitle");
  var calBody = document.getElementById("calBody");
  var calActions = document.getElementById("calActions");

  // Doc section 12.4's weight-entry default. Duplicated from
  // calibrator.DEFAULT_REF_MASS_G rather than sent over the wire — it is
  // only ever a starting point the operator can overtype, never sent
  // as-is without the input field touching it, so the two do not need to
  // be the same variable, only the same number.
  var DEFAULT_REF_MASS_G = 500;

  var wizard = null;   // {bin, op, step, weight, message} | null

  function openWizard(bin, op) {
    wizard = { bin: bin, op: op, step: "confirm", weight: String(DEFAULT_REF_MASS_G) };
    renderWizard();
    calBackdrop.classList.add("show");
  }

  function closeWizard() {
    wizard = null;
    calBackdrop.classList.remove("show");
  }

  function modalButton(label, primary, onClick) {
    var b = document.createElement("button");
    b.className = "modal-btn" + (primary ? " primary" : "");
    b.textContent = label;
    b.addEventListener("click", onClick);
    return b;
  }

  function renderWizard() {
    if (!wizard) return;
    calTitle.textContent = "Bin " + wizard.bin;
    calBody.innerHTML = "";
    calActions.innerHTML = "";
    calBody.classList.remove("error");

    if (wizard.step === "confirm" && wizard.op === "tare") {
      calBody.appendChild(document.createTextNode(
        "Make sure bin " + wizard.bin + " is empty."));
      calActions.appendChild(modalButton("Cancel", false, closeWizard));
      calActions.appendChild(modalButton("Confirm", true, function () {
        wizard.step = "capturing";
        renderWizard();
        sendCal({ t: "tare", bin: wizard.bin });
      }));

    } else if (wizard.step === "confirm" && wizard.op === "calibrate") {
      calBody.appendChild(document.createTextNode(
        "Place a known weight in bin " + wizard.bin + "."));

      var inputRow = document.createElement("div");
      inputRow.className = "weight-input-row";
      var input = document.createElement("input");
      input.className = "weight-input";
      input.type = "number";
      input.inputMode = "decimal";
      input.min = "0";
      input.step = "any";
      input.value = wizard.weight;
      input.addEventListener("input", function () { wizard.weight = input.value; });
      inputRow.appendChild(input);
      var unit = document.createElement("span");
      unit.className = "weight-unit";
      unit.textContent = "g";
      inputRow.appendChild(unit);
      calBody.appendChild(inputRow);

      var confirmCalibrate = function () {
        var grams = parseFloat(wizard.weight);
        if (!isFinite(grams) || grams <= 0) return;
        wizard.step = "capturing";
        renderWizard();
        sendCal({ t: "calibrate", bin: wizard.bin, ref_mass_g: grams });
      };
      // Enter submits straight from the keyboard, same as tapping Confirm.
      input.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter") confirmCalibrate();
      });

      calActions.appendChild(modalButton("Cancel", false, closeWizard));
      calActions.appendChild(modalButton("Confirm", true, confirmCalibrate));

      // Focus after the element is in the DOM, and select so typing
      // overtypes the DEFAULT_REF_MASS_G prefill instead of appending to it.
      setTimeout(function () { input.focus(); input.select(); }, 0);

    } else if (wizard.step === "capturing") {
      calBody.appendChild(document.createTextNode("Capturing… (2s)"));

    } else if (wizard.step === "done") {
      calBody.appendChild(document.createTextNode(wizard.message));
      calActions.appendChild(modalButton("Done", true, closeWizard));

    } else if (wizard.step === "error") {
      calBody.classList.add("error");
      calBody.appendChild(document.createTextNode(wizard.message));
      calActions.appendChild(modalButton("Close", false, closeWizard));
      calActions.appendChild(modalButton("Try again", true, function () {
        wizard.step = "confirm";
        wizard.weight = String(DEFAULT_REF_MASS_G);
        renderWizard();
      }));
    }
  }

  function applyCalResult(msg) {
    // A result for a screen that already moved on (closed, or a second
    // tare/calibrate raced it) — doc section 12.4's flow is one screen
    // at a time, so a stale result must not reopen or overwrite it.
    if (!wizard || wizard.bin !== msg.bin || wizard.op !== msg.op
        || wizard.step !== "capturing") {
      return;
    }
    wizard.step = msg.ok ? "done" : "error";
    wizard.message = msg.message;
    renderWizard();
  }

  // Reconnect with the same shape of backoff as every other client in
  // this system (doc section 20.2) — a tablet left on overnight should
  // recover on its own, not need a page reload.
  var BACKOFF_START = 1000, BACKOFF_MAX = 10000;
  var backoff = BACKOFF_START;

  function connect() {
    var scheme = location.protocol === "https:" ? "wss:" : "ws:";
    var ws = new WebSocket(scheme + "//" + location.host + "/ws");
    currentWs = ws;

    ws.onopen = function () {
      backoff = BACKOFF_START;
      banner.classList.remove("show");
    };
    ws.onmessage = function (ev) {
      var msg;
      try { msg = JSON.parse(ev.data); } catch (e) { return; }
      if (msg.t === "pips") applyPips(msg.pips);
      else if (msg.t === "bins") applyBins(msg);
      else if (msg.t === "cal_result") applyCalResult(msg);
    };
    ws.onclose = function () {
      banner.classList.add("show");
      setTimeout(connect, backoff);
      backoff = Math.min(backoff * 2, BACKOFF_MAX);
    };
    ws.onerror = function () { ws.close(); };
  }

  connect();
})();
</script>
</body>
</html>
