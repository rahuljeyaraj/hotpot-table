[env:seeed_xiao_esp32s3]
platform = espressif32@6.2.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200

; ESP32-S3 has no USB-UART bridge; Serial is the on-chip USB CDC peripheral.
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

; HX711-multi is vendored in lib/, see lib/HX711-multi/README.md.
